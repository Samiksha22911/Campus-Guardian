# Render Blueprint. Service root = REPO ROOT on purpose: the backend reads
# ../demo-data/results.json, which would not exist inside a "backend/"-only root.
services:
  - type: web
    name: campus-guardian-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_MODE
        value: "true"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL        # Aiven MySQL URL (paste in the dashboard)
        sync: false
      - key: DB_SSL_CA
        value: certs/aiven-ca.pem
      - key: CORS_ORIGINS        # your Vercel URL (paste in the dashboard)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
