<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Guardian AI</title>
    <meta name="description" content="AI-powered smart campus entry verification and security system." />
    <meta name="author" content="Campus Guardian AI" />
    <meta property="og:title" content="Campus Guardian AI" />
    <meta property="og:description" content="AI-powered smart campus entry verification and security system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Apply the saved theme before first paint so there is no light/dark flash.
         Keep in sync with THEME_STORAGE_KEY in src/lib/theme.js -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("campus-guardian-theme");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
